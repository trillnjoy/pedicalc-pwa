<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a2332">
  <title>PediCalc EMR - Clinical Decision Support</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="description" content="27 evidence-based pediatric clinical calculators for point-of-care decision support">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: #ffffff;
      touch-action: pan-y;
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #d4a444 0%, #c69332 50%, #b88520 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 10000;
      animation: fadeOut 0.5s ease 2s forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        pointer-events: none;
      }
    }

    #splash-icon {
      width: 180px;
      height: 180px;
      margin-bottom: 32px;
      border-radius: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes scaleIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    #splash-title {
      font-size: 48px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      animation: slideUp 0.6s ease 0.2s both;
    }

    #splash-subtitle {
      font-size: 16px;
      font-weight: 400;
      color: rgba(0, 0, 0, 0.7);
      text-align: center;
      max-width: 320px;
      padding: 0 20px;
      line-height: 1.4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      animation: slideUp 0.6s ease 0.4s both;
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1a2332;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #4d94ff;
      font-family: 'IBM Plex Mono', monospace;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
    }

    #loading.show {
      opacity: 1;
      pointer-events: auto;
    }

    #loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(77,148,255,0.2);
      border-top-color: #4d94ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <!-- Splash Screen (2 seconds) -->
  <div id="splash">
    <img id="splash-icon" src="icon-512.png" alt="PediCalc">
    <div id="splash-title">PediCalc</div>
    <div id="splash-subtitle">A Collection of Helpful Pediatric Calculators</div>
  </div>

  <!-- Loading Screen (shows if app takes time to load) -->
  <div id="loading">
    <div id="loading-spinner"></div>
    <div id="loading-text">Loading PediCalc...</div>
  </div>
  
  <div id="root"></div>

  <!-- Babel Standalone: transpiles JSX → plain JS at runtime -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="module">
    import React from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';

    async function loadApp() {
      try {
        // Show loading screen after splash (2 seconds)
        setTimeout(() => {
          document.getElementById('loading').classList.add('show');
        }, 2000);

        // Load the JSX component source
        const response = await fetch('PediatricCalc.jsx');
        const code = await response.text();

        // Strip import lines and the export default keyword
        const componentCode = code
          .replace(/^import.*?;?\n/gm, '')
          .replace(/export default /, '');

        // CRITICAL: Transpile JSX → plain JS before passing to new Function()
        // new Function() only accepts standard JS, not JSX syntax
        const transpiled = Babel.transform(componentCode, {
          presets: ['react']
        }).code;

        // Pass only React; hooks are destructured inside to avoid duplicate const declarations
        const componentFn = new Function('React', `
          const { useState, useEffect, useRef } = React;
          ${transpiled}
          return App;
        `);

        const App = componentFn(React);

        // Hide loading screen
        document.getElementById('loading').classList.remove('show');

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));

      } catch (error) {
        console.error('Failed to load app:', error);
        document.getElementById('loading-text').textContent = 'Error loading app';
        document.getElementById('loading-text').style.color = '#db3737';
      }
    }

    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registered'))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

    // Load the app
    loadApp();
  </script>
</body>
</html>
