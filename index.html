<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a2332">
  <title>PediCalc EMR - Clinical Decision Support</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="description" content="27 evidence-based pediatric clinical calculators for point-of-care decision support">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: #ffffff;
      touch-action: pan-y;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #d4a444 0%, #c69332 50%, #b88520 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      z-index: 9999;
    }

    #loading img {
      width: 180px;
      height: 180px;
      margin-bottom: 32px;
      border-radius: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    #loading h1 {
      font-size: 48px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 12px;
    }

    #loading p {
      font-size: 16px;
      font-weight: 400;
      color: rgba(0, 0, 0, 0.7);
      text-align: center;
      max-width: 320px;
      padding: 0 20px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icon-512.png" alt="PediCalc">
    <h1>PediCalc</h1>
    <p>A Collection of Helpful Pediatric Calculators</p>
  </div>
  <div id="root"></div>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="module">
    import React from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';

    async function loadApp() {
      const startTime = Date.now();

      try {
        const response = await fetch('PediatricCalc.jsx');
        const code = await response.text();

        const componentCode = code
          .replace(/^import.*?;?\n/gm, '')
          .replace(/export default /, '');

        const transpiled = Babel.transform(componentCode, {
          presets: ['react']
        }).code;

        const componentFn = new Function('React', `
          const { useState, useEffect, useRef } = React;
          ${transpiled}
          return App;
        `);

        const App = componentFn(React);

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));

        const elapsed = Date.now() - startTime;
        const remainingTime = Math.max(0, 2000 - elapsed);

        setTimeout(() => {
          document.getElementById('loading').style.display = 'none';
        }, remainingTime);

      } catch (error) {
        console.error('Failed to load app:', error);
        document.getElementById('loading').innerHTML = '<p style="color: #db3737; padding: 20px;">Error loading app</p>';
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registered'))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

    loadApp();
  </script>
</body>
</html>
